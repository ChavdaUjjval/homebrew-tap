name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}   # avoids the shared runner's API rate limit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/chavdaujjval"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/chavdaujjval/homebrew-tap"

      # The exact command in the README, on a tap nobody has trusted yet.
      - name: Install with the README command
        run: |
          brew install chavdaujjval/tap/copycat
          test -d /Applications/Copycat.app
          test -z "$(xattr -p com.apple.quarantine /Applications/Copycat.app 2>/dev/null)"

      - name: Style and audit
        run: |
          brew trust --cask chavdaujjval/tap/copycat
          brew style chavdaujjval/tap
          brew audit --cask --online chavdaujjval/tap/copycat

      - name: Uninstall
        run: |
          brew uninstall --cask chavdaujjval/tap/copycat
          test ! -d /Applications/Copycat.app
